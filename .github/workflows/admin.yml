name: Admin backoffice

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python admin_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}

      - name: Commit changes
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.json admin_state.json
          git diff --cached --quiet || git commit -m "backoffice update"
          git push
